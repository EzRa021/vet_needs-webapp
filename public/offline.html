<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · VetNeeds</title>
    <style>
      /* Self-contained — an offline page can't fetch a stylesheet. Brand tokens
         inline, and it renders in dark mode too. */
      :root { color-scheme: light dark; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; text-align: center;
        font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #FAFBF8; color: #1E293B;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #12160f; color: #e7ece1; }
      }
      .mark {
        width: 64px; height: 64px; border-radius: 18px; background: #1F6B45;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;
      }
      h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: .5rem; }
      p { color: #64748B; line-height: 1.6; max-width: 22rem; margin: 0 auto 1.5rem; }
      @media (prefers-color-scheme: dark) { p { color: #9aa6b2; } }
      button {
        cursor: pointer; border: 0; border-radius: 10px; padding: .75rem 1.5rem;
        font-size: .95rem; font-weight: 600; color: #fff; background: #1F6B45;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 512 512" fill="none" aria-hidden="true">
          <g fill="#F5EFDB" stroke="#F5EFDB" stroke-width="14" stroke-linecap="round">
            <line x1="256" y1="200" x2="256" y2="392" />
          </g>
          <g fill="#F5EFDB">
            <ellipse cx="256" cy="150" rx="17" ry="36" />
            <ellipse cx="222" cy="196" rx="16" ry="34" transform="rotate(-32 222 196)" />
            <ellipse cx="290" cy="196" rx="16" ry="34" transform="rotate(32 290 196)" />
            <ellipse cx="216" cy="248" rx="16" ry="34" transform="rotate(-34 216 248)" />
            <ellipse cx="296" cy="248" rx="16" ry="34" transform="rotate(34 296 248)" />
          </g>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        We can't reach VetNeeds right now. Prices and stock change, so we won't show
        you an old page — check your connection and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
